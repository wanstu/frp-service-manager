name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    uses: wanstu/wails-desktop-kit/.github/workflows/wails-desktop.yml@v0.6.0
    with:
      app-name: frp-service-manager
      desktop-dir: cmd/frp-service-manager
      linux-package-formats: raw,deb
      linux-package-description: Remote FRPS Dashboard manager
      linux-desktop-file: packaging/frp-service-manager.desktop
      linux-icon-file: cmd/frp-service-manager/assets/appicon.png
