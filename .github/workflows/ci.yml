name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    uses: wanstu/wails-desktop-kit/.github/workflows/wails-desktop.yml@v0.5.1
    with:
      app-name: frp-service-manager
      desktop-dir: cmd/frp-service-manager
      linux-deb: true
      linux-deb-description: Remote FRPS Dashboard manager
